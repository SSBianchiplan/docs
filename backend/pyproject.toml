[project]
name = "gplansis-docs"
version = "0.1.0"
description = "GPlanSiS|DOCS — EDMS de documentos técnicos com OCR"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "minio>=7.2",
  "arq>=0.26",
  "httpx>=0.27",
  "email-validator>=2.1",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "img2pdf>=0.5",
  "ocrmypdf>=16.4",
  "pillow>=10.4",
]
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
embeddings = ["fastembed>=0.4"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
