<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14202B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F5F6" media="(prefers-color-scheme: light)" />
    <meta name="description" content="GPlanSiS|DOCS — gestão de documentos técnicos de engenharia" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>GPlanSiS|DOCS</title>
    <script>
      // aplica o tema antes do primeiro paint (sem flash)
      try {
        var t = JSON.parse(localStorage.getItem("gps-docs-ui") || "{}").state?.theme || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
