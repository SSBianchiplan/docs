<style>
/* ---------- tokens: claro ("papel vegetal") / escuro ("sala de controle de documentos") ---------- */
:root{
  --bg:#f3f5f6;--surface:#fff;--surface-2:#eaeef0;--line:#d6dde1;--line-strong:#b7c2c9;

  --info:#2c5d9e;--info-soft:#dfe8f6;--sheet:#fbfcfc;--sheet-ink:#1d2a36;
  --r-ctl:6px;--r-panel:10px;
  --sans:"Barlow","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;

  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a;--surface:#151d25;--surface-2:#1b252f;--line:#26323d;--line-strong:#37475a;
    --ink:#e2e8ed;--ink-2:#b9c4cd;--muted:#8593a0;
    --accent:#40b4ba;--accent-ink:#06201f;--accent-soft:#11363a;--delta:#f0654f;
    --ok:#5cc486;--ok-soft:#133524;--warn:#f0b04a;--warn-soft:#3a2a10;--bad:#f07a70;--bad-soft:#3c1917;
    --info:#7fa9e6;--info-soft:#172a45;--sheet:#e9edef;--sheet-ink:#1d2a36;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a;--surface:#151d25;--surface-2:#1b252f;--line:#26323d;--line-strong:#37475a;
  --ink:#e2e8ed;--ink-2:#b9c4cd;--muted:#8593a0;
  --accent:#40b4ba;--accent-ink:#06201f;--accent-soft:#11363a;--delta:#f0654f;
  --ok:#5cc486;--ok-soft:#133524;--warn:#f0b04a;--warn-soft:#3a2a10;--bad:#f07a70;--bad-soft:#3c1917;
  --info:#7fa9e6;--info-soft:#172a45;--sheet:#e9edef;--sheet-ink:#1d2a36;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:13px} .xs{font-size:12px} .xxs{font-size:11px}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column;gap:8px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.btn:hover{background:var(--surface-2)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:transparent} .btn.p:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,transparent)} .btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px} .btn.block{width:100%}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input{width:100%;min-height:42px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:15px;outline:none}
.input:focus{border-color:var(--accent)} textarea.input{padding:10px 12px;min-height:84px;resize:vertical}
.label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.field{margin-bottom:14px} .hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.pad{padding:14px} .mb{margin-bottom:14px} .mt{margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.t-neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)} .t-info{background:var(--info-soft);color:var(--info)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-ok{background:var(--ok-soft);color:var(--ok)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-accent{background:var(--accent-soft);color:var(--accent)}
.skel{background:var(--surface-2);border-radius:6px;animation:pulse 1.2s infinite} @keyframes pulse{50%{opacity:.5}}

/* delta de revisão */
.delta{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;flex:none}
.delta svg{position:absolute;inset:0;width:100%;height:100%}
.delta b{position:relative;font-family:var(--mono);font-weight:600;line-height:1}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand img,.brand svg{width:30px;height:30px}
.persona{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;min-height:36px}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.content{width:100%;max-width:1320px;margin:0 auto;padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;font-size:11px;color:var(--muted)}
.bnav a.on{color:var(--accent)} .bnav .dot{position:absolute;top:8px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:8px;background:var(--delta);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.h1{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:0}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.h2{font-size:15px;font-weight:600;margin:0 0 10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.metric{padding:12px 14px}
.metric .v{font-size:28px;font-weight:600;line-height:1.1}
.metric.alert{border-color:color-mix(in oklab,var(--delta) 55%,transparent)} .metric.alert .v{color:var(--delta)}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:52px}
a.item:hover,button.item:hover{background:var(--surface-2)}
button.item{width:100%;border:0;background:none;text-align:left;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.count{font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 6px}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty .icon{width:28px;height:28px;margin-bottom:6px}
.empty p{margin:4px 0} .empty strong{color:var(--ink);font-weight:600}

/* carimbo */
.tb{overflow:hidden}
.tb-top{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
.tb-cells{display:grid;grid-template-columns:1fr 1fr}
.tb-cells>div{padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}
.tb-cells>div:nth-child(odd){border-right:1px solid var(--line)}
.tb-cells .k{font-size:11px;color:var(--muted)} .tb-cells .v{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:color-mix(in oklab,var(--surface-2) 50%,transparent)}
.revs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.revbtn{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px 0 8px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.revbtn.on{border-color:var(--accent);background:var(--accent-soft)}

/* prancha */
.viewer{display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--surface-2) 60%,transparent)}
.vstage{overflow:auto;background:color-mix(in oklab,var(--surface-2) 70%,var(--bg));padding:12px;touch-action:pan-x pan-y}
.sheetwrap{position:relative;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.18);background:var(--sheet);transform-origin:top left}
.sheetwrap svg.sheet{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0}
.overlay.drawing{cursor:crosshair;touch-action:none}
.cm{position:absolute;border:2px solid;border-radius:2px;background:transparent;cursor:pointer;padding:0}
.cm.done{border-style:dashed;opacity:.7}
.cm.act{box-shadow:0 0 0 4px color-mix(in oklab,var(--warn) 40%,transparent);background:color-mix(in oklab,var(--warn) 15%,transparent)}
.cm i{position:absolute;top:-10px;left:-10px;width:20px;height:20px;border-radius:50%;color:#fff;font:600 11px/20px var(--sans);font-style:normal;text-align:center}
.drag{position:absolute;border:2px dashed var(--delta);background:color-mix(in oklab,var(--delta) 12%,transparent);pointer-events:none}

/* folhas e toasts */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);animation:fade .15s}
.sheetpane{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:14px 14px 0 0;border:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheetpane header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheetpane header::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line-strong)}
.sheetpane .body{overflow-y:auto;padding:14px 16px}
.sheetpane footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
.toasts{position:fixed;z-index:80;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--r-panel);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:11px 14px;font-size:14px;animation:up .2s}
.toast.bad{border-left-color:var(--bad)} .toast .inv{display:block;font-family:var(--mono);font-size:11px;color:var(--bad);margin-bottom:2px}

/* pipeline de OCR */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;color:var(--muted)}
.steps li .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center}
.steps li.run{color:var(--ink)} .steps li.run .st{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.ok{color:var(--ink)} .steps li.ok .st{border-color:var(--ok);background:var(--ok)} .steps li.ok .st::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden} .bar>div{height:100%;background:var(--accent)}

table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:color-mix(in oklab,var(--surface-2) 55%,transparent)}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-2)}
.scrollx{overflow-x:auto}
.desk{display:none}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 12px}
.timeline li::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--warn))}
pre.ocr{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--surface-2);border-radius:6px;padding:10px;max-height:340px;overflow:auto;margin:4px 0 12px}

/* ---------- desktop ---------- */
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;width:236px;flex:none;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;align-self:flex-start;height:100dvh}
  .side nav{flex:1;padding:8px;overflow-y:auto}
  .side nav a{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:6px;color:var(--ink-2);font-size:14px}
  .side nav a:hover{background:var(--surface-2)} .side nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .side nav a .n{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--delta);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .side .sb{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
  .bnav,.mob{display:none!important}
  .desk{display:block} .desk.btn{display:inline-flex} span.desk{display:inline-flex}
  .content{padding:22px 24px 40px}
  .toasts{left:auto;right:20px;bottom:20px;width:400px}
  .sheetpane{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;animation:none}
  .sheetpane header::before{display:none}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:2fr 1fr}
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
  .detail aside{position:sticky;top:70px;max-height:calc(100dvh - 90px);display:flex;flex-direction:column}
  .tb-cells{grid-template-columns:repeat(6,1fr)} .tb-cells>div{border-bottom:0;border-right:1px solid var(--line)} .tb-cells>div:last-child{border-right:0}
}
@media (min-width:640px) and (max-width:1023px){ .g4{grid-template-columns:repeat(4,1fr)} }
@media print{.top,.bnav,.side,.tb-actions,.noprint{display:none!important} .content{padding:0}}
</style>

<script>
"use strict";
/* =====================================================================
   GPlanSiS|DOCS — protótipo standalone (sem rede, sem dependências)
   As regras INV-* reproduzem as invariantes do schema PostgreSQL do sistema.
   ===================================================================== */
const KEY = "gps-docs-proto-v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const raw = (s) => ({ __raw: String(s) });
function h(strings, ...vals) {
  let out = "";
  strings.forEach((s, i) => {
    out += s;
    if (i < vals.length) {
      const v = vals[i];
      const one = (x) => (x == null || x === false ? "" : x.__raw !== undefined ? x.__raw : esc(x));
      out += Array.isArray(v) ? v.map(one).join("") : one(v);
    }
  });
  return raw(out);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const DAY = 86400000;
const nowIso = () => new Date().toISOString();
const ago = (d, hrs = 0) => new Date(Date.now() - d * DAY - hrs * 3600000).toISOString();
const fmtD = (s) => (s ? new Date(s).toLocaleDateString("pt-BR") : "—");
const fmtDT = (s) => (s ? new Date(s).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
function rel(s) {
  const d = (new Date(s) - Date.now()) / 1000, a = Math.abs(d), f = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
  if (a < 3600) return f.format(Math.round(d / 60), "minute");
  if (a < 86400) return f.format(Math.round(d / 3600), "hour");
  return f.format(Math.round(d / 86400), "day");
}
const norm = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/* ---------- SHA-256 (síncrono, para a cadeia de auditoria e manifestos de GRD) ---------- */
const sha256 = (() => {
  const K = [], H = [];
  let n = 2, c = 0;
  const isP = (x) => { for (let f = 2; f * f <= x; f++) if (x % f === 0) return false; return true; };
  while (c < 64) { if (isP(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; } n++; }
  return (str) => {

/* ---------- toasts e folhas ---------- */
function toast(msg, tone = "ok", code) {
  const el = document.createElement("div");
  el.className = "toast" + (tone === "bad" ? " bad" : "");
  el.innerHTML = (code ? `<span class="inv">Recusado pelo banco · ${esc(code)}</span>` : "") + esc(msg);
  const box = $("#toasts"); box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => el.remove(), tone === "bad" ? 6500 : 3200);
}
function run(fn, okMsg) {
  try { const r = fn(); save(); render(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }
  catch (e) { if (e instanceof Inv) toast(e.message, "bad", e.code); else { console.error(e); toast(e.message || String(e), "bad"); } }
}
function sheet(title, body, footer) {
  $("#layer").innerHTML = h`<div class="scrim" data-a="close"></div>
    <section class="sheetpane" role="dialog" aria-modal="true" aria-label="${title}">

      <div class="body">${body}</div>${footer ? h`<footer>${footer}</footer>` : ""}</section>`.__raw;
  setTimeout(() => $("#layer .body input, #layer .body select, #layer .body textarea")?.focus(), 30);
}

const route = () => (location.hash.replace(/^#\/?/, "") || "painel").split("/");
function myTasks(uid2 = S.me) {
  const out = [];
  for (const d of S.docs) for (const v of d.revs) if (v.workflow && v.workflow.status === "ATIVO")
    v.workflow.steps.forEach((st, i) => { if (st.status === "PENDENTE" && st.assignee === uid2) out.push({ d, v, st, i }); });
  return out.sort((a, b) => new Date(a.st.due) - new Date(b.st.due));
}

/* ---------- prancha sintética (SVG) ---------- */
function sheetSvg(d, v, page) {
  const r = rng([...d.code].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 + page);
  if (!DRAWING.has(d.type)) {
    const W = 595, H = 842; let lines = "";
    const txt = v.files[0]?.text.split("\n") || [d.title];
    txt.forEach((l, i) => { if (page === 1) lines += `<text x="56" y="${150 + i * 22}" font-size="${i === 0 ? 13 : 10}" font-weight="${i === 0 ? 600 : 400}">${esc(l.slice(0, 86))}</text>`; });
    for (let i = 0; i < 22; i++) { const y = (page === 1 ? 300 : 110) + i * 22, w = 360 + r() * 120; lines += `<rect x="56" y="${y}" width="${w}" height="6" rx="2" opacity=".18"/>`; }
    return `<svg class="sheet" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" fill="var(--sheet-ink)" font-family="Arial,sans-serif">
      <rect width="${W}" height="${H}" fill="var(--sheet)"/><rect x="28" y="28" width="${W - 56}" height="${H - 56}" fill="none" stroke="var(--sheet-ink)" stroke-width="1.2"/>
      <rect x="28" y="28" width="${W - 56}" height="70" fill="none" stroke="var(--sheet-ink)"/><text x="44" y="58" font-size="15" font-weight="700">${esc(PROJECT.name.toUpperCase())}</text>
      <text x="44" y="80" font-size="10">${esc(d.code)} · REV. ${esc(v.label)} · FOLHA ${page}</text><text x="${W - 44}" y="58" font-size="10" text-anchor="end">${esc(TYPE[d.type])}</text>${lines}
      <text x="${W / 2}" y="${H - 40}" font-size="9" text-anchor="middle">Página ${page}</text></svg>`;
  }
  const W = 1189, H = 841; let g = "";
  for (let i = 0; i < 9; i++) { const x = 110 + r() * 700, y = 110 + r() * 440; g += r() > .5 ? `<circle cx="${x}" cy="${y}" r="${18 + r() * 26}" fill="none" stroke-width="2"/>` : `<rect x="${x}" y="${y}" width="${50 + r() * 110}" height="${30 + r() * 70}" fill="none" stroke-width="2"/>`; }
  for (let i = 0; i < 14; i++) { const x = 100 + r() * 640, y = 100 + r() * 420, hz = r() > .5, len = 80 + r() * (hz ? 260 : 160); g += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} ${hz ? "h" : "v"}${len.toFixed(1)}" stroke-width="${r() > .7 ? 3 : 1.4}" fill="none"/>`; }
  for (let i = 0; i < 6; i++) { const x = 120 + r() * 760, y = 120 + r() * 460; g += `<text x="${x}" y="${y}" font-size="11">${["PSV-1101", "B-101A", 'VS-1203 6"', "PT-1101", "N3", "EL. +4500"][i]}</text>`; }
  const refs = [...Array(8)].map((_, i) => `<text x="${80 + i * 140}" y="44" font-size="11" text-anchor="middle">${i + 1}</text><text x="44" y="${110 + i * 90}" font-size="11">${"ABCDEFGH"[i]}</text>`).join("");
  const tbx = W - 400, tby = H - 170;
  return `<svg class="sheet" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" stroke="var(--sheet-ink)" fill="var(--sheet-ink)" font-family="Arial,sans-serif">
    <rect width="${W}" height="${H}" fill="var(--sheet)" stroke="none"/><rect x="24" y="24" width="${W - 48}" height="${H - 48}" fill="none" stroke-width="1"/><rect x="56" y="56" width="${W - 112}" height="${H - 112}" fill="none" stroke-width="2.2"/>
    <g stroke="none">${refs}</g><g>${g}</g>
    <g stroke="none"><text x="80" y="${H - 120}" font-size="11">NOTA 1: TODAS AS COTAS EM MILÍMETROS.</text><text x="80" y="${H - 102}" font-size="11">NOTA 2: FLANGES CLASSE 300 CONFORME ASME B16.5.</text></g>
    <g fill="none" stroke-width="1.6"><rect x="${tbx}" y="${tby}" width="344" height="114"/><path d="M${tbx} ${tby + 44}h344M${tbx} ${tby + 80}h344M${tbx + 250} ${tby + 80}v34M${tbx + 170} ${tby + 80}v34"/></g>
    <g stroke="none"><text x="${tbx + 8}" y="${tby + 14}" font-size="8">TÍTULO</text><text x="${tbx + 8}" y="${tby + 34}" font-size="12" font-weight="700">${esc(d.title.toUpperCase().slice(0, 44))}</text>
      <text x="${tbx + 8}" y="${tby + 56}" font-size="8">NÚMERO</text><text x="${tbx + 8}" y="${tby + 73}" font-size="14" font-family="monospace" font-weight="700">${esc(d.code)}</text>
      <text x="${tbx + 8}" y="${tby + 94}" font-size="8">ESCALA</text><text x="${tbx + 8}" y="${tby + 108}" font-size="11">1:50</text>
      <text x="${tbx + 178}" y="${tby + 94}" font-size="8">FOLHA</text><text x="${tbx + 178}" y="${tby + 108}" font-size="11">${page}/2</text>
      <text x="${tbx + 258}" y="${tby + 94}" font-size="8">REV.</text></g>
    <path d="M${tbx + 305} ${tby + 86} l14 24 h-28z" fill="none" stroke="#d2412f" stroke-width="2"/><text x="${tbx + 305}" y="${tby + 106}" font-size="11" text-anchor="middle" stroke="none" font-family="monospace" font-weight="700">${esc(v.label)}</text>
  </svg>`;
}

    <div class="tb-actions">
      ${d.checkout ? h`<span class="small row" style="color:var(--info);gap:4px;width:100%">${ic("lock")}Em check-out com ${user(d.checkout.user).name} ${rel(d.checkout.at)}</span>` : ""}
      ${canWrite() ? (d.checkout ? (d.checkout.user === u.id || canControl() ? h`<button class="btn sm" data-a="checkin" data-id="${d.id}">${ic("unlock")}Check-in</button>` : "") : h`<button class="btn sm" data-a="checkout" data-id="${d.id}">${ic("lock")}Check-out</button>`) : ""}
      ${canWrite() && !hasOpen && !lockedOther ? h`<button class="btn sm" data-a="newrev" data-id="${d.id}">${ic("branch")}Nova revisão</button>` : ""}
      ${editable ? h`<button class="btn sm p" data-a="wf" data-id="${d.id}" data-rev="${v.id}">${ic("send")}Enviar para verificação</button>` : ""}
      ${v.status === "EMITIDA" && canControl() ? h`<button class="btn sm p" data-a="return" data-id="${d.id}" data-rev="${v.id}">Registrar retorno</button>` : ""}
      ${v.status === "APROVADA_INTERNA" && canControl() ? h`<a class="btn sm" href="#/grd">${ic("send")}Incluir em GRD</a>` : ""}
      ${d.revs.length > 1 && v.current ? h`<button class="btn sm ghost" data-a="checkcm" data-id="${d.id}" data-rev="${v.id}">${ic("bot")}Verificar comentários anteriores</button>` : ""}
      ${OPEN.includes(v.status) && canWrite() ? h`<button class="btn sm danger" data-a="cancelrev" data-id="${d.id}" data-rev="${v.id}">Cancelar revisão</button>` : ""}
    </div>
  </section>
  ${sugg.map((s) => suggCard(s))}
  <div class="revs" role="tablist" aria-label="Revisões">${d.revs.slice().reverse().map((x) => h`<button class="revbtn ${x.id === v.id ? "on" : ""}" role="tab" aria-selected="${x.id === v.id}" data-a="rev" data-v="${x.id}">${delta(x.label, 24, !x.current)}<span><span class="xs" style="display:block;font-weight:500">${STATUS[x.status][0]}</span><span class="xxs muted">${fmtD(x.issuedAt || x.createdAt)}</span></span></button>`)}</div>
  <div class="detail">
    <section class="panel viewer">
      <div class="vbar">
        ${pdf ? h`<button class="btn ghost sm" data-a="pg" data-v="-1" ${ui.page <= 1 ? "disabled" : ""} aria-label="Página anterior">${ic("left")}</button><span class="small tnum">${ui.page} / ${pages}</span><button class="btn ghost sm" data-a="pg" data-v="1" ${ui.page >= pages ? "disabled" : ""} aria-label="Próxima página">${ic("right")}</button>
        <button class="btn ghost sm" data-a="zoom" data-v="-1" aria-label="Reduzir">${ic("zout")}</button><span class="xs tnum" style="width:40px;text-align:center">${Math.round(ui.zoom * 100)}%</span><button class="btn ghost sm" data-a="zoom" data-v="1" aria-label="Ampliar">${ic("zin")}</button>
        ${u.role !== "LEITOR" ? h`<button class="btn sm ${ui.draw ? "p" : ""}" style="margin-left:auto" data-a="draw" aria-pressed="${ui.draw}">${ic("box")}${ui.draw ? "Marque a área" : "Comentar área"}</button>` : ""}` : h`<span class="small muted" style="padding:6px">Sem PDF nesta revisão</span>`}
      </div>
      <div class="vstage" style="max-height:72dvh">
        ${pdf ? h`<div class="sheetwrap" style="width:${ui.zoom * 100}%">
            ${raw(sheetSvg(d, v, ui.page))}
            <div class="overlay ${ui.draw ? "drawing" : ""}" data-overlay="1" data-doc="${d.id}" data-rev="${v.id}">
              ${pageC.map((c) => { idx++; return h`<button class="cm ${c.status !== "ABERTO" ? "done" : ""} ${ui.act === c.id ? "act" : ""}" data-a="cm" data-v="${c.id}" title="${c.body}" style="left:${c.x * 100}%;top:${c.y * 100}%;width:${c.w * 100}%;height:${c.h * 100}%;border-color:${CAT[c.cat][1]}"><i style="background:${CAT[c.cat][1]}">${idx}</i></button>`; })}
              ${ui.draft && ui.draft.page === ui.page ? h`<div class="drag" style="left:${ui.draft.x * 100}%;top:${ui.draft.y * 100}%;width:${ui.draft.w * 100}%;height:${ui.draft.h * 100}%"></div>` : ""}
            </div></div>` : h`<div class="panel" style="max-width:520px;margin:20px auto">${editable ? h`<label class="empty" style="display:block;cursor:pointer">${ic("upload")}<p><strong>Toque para anexar arquivos</strong></p><p class="small">PDF, imagem ou Office. O OCR roda em seguida.</p><input type="file" multiple hidden data-upload="${d.id}" data-rev="${v.id}"></label>` : empty("file", "Nenhum PDF nesta revisão", v.files.length ? "Há só arquivos nativos." : "Esta revisão ainda não tem arquivos.")}</div>`}
      </div>
    </section>
    <aside class="panel" style="min-height:320px">
      <div class="tabs" role="tablist">${tabs.map(([k, l, i, n]) => h`<button class="tab ${ui.tab === k ? "on" : ""}" role="tab" aria-selected="${ui.tab === k}" data-a="tab" data-v="${k}">${ic(i)}${l}${n ? h`<span class="count tnum">${n}</span>` : ""}</button>`)}</div>
      <div style="padding:12px;overflow-y:auto;flex:1">${tabBody(d, v, editable)}</div>
    </aside>
  </div>`;
}
function suggCard(s) {
  const pl = Object.entries(s.payload).filter(([k]) => k !== "comentario");
  return h`<section class="panel pad mb" style="border-left:4px solid var(--info)">
    <div class="row small" style="font-weight:600;margin-bottom:6px">${ic("bot")}<span class="grow">${s.kind === "METADADOS_CARIMBO" ? "A IA leu o carimbo e propõe atualizar metadados" : "A IA encontrou evidência de comentário atendido"}</span><span class="xs muted tnum">${Math.round(s.conf * 100)}%</span></div>
    ${s.payload.comentario ? h`<p class="small" style="margin:0 0 6px">“${s.payload.comentario}”</p>` : ""}
    <dl style="display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px" class="small">${pl.map(([k, val]) => h`<dt class="muted">${k}</dt><dd style="margin:0;overflow-wrap:anywhere">${val}</dd>`)}</dl>
    <div class="row"><span class="xxs muted grow">${s.engine} · a decisão é sua</span><button class="btn sm" data-a="sugg" data-id="${s.id}" data-v="REJEITADA">${ic("x")}Rejeitar</button><button class="btn sm p" data-a="sugg" data-id="${s.id}" data-v="APLICADA">${ic("check")}Aplicar</button></div>
  </section>`;
}
function tabBody(d, v, editable) {
  const u = me();
  if (ui.tab === "comentarios") {
    let n = 0;
    return h`${u.role !== "LEITOR" ? h`<form class="panel pad mb" data-form="comment" data-doc="${d.id}" data-rev="${v.id}" style="${ui.draft ? "border-color:var(--delta)" : ""}">
        <p class="xs muted" style="margin:0 0 6px">${ui.draft ? h`Comentário na folha ${ui.draft.page}, área marcada · <button type="button" class="xs" style="background:none;border:0;text-decoration:underline;color:var(--accent);cursor:pointer" data-a="nodraft">descartar área</button>` : "Comentário geral · use “Comentar área” na prancha para marcar a folha"}</p>
        <textarea class="input" name="body" placeholder="Descreva a alteração solicitada" aria-label="Comentário" required minlength="2"></textarea>
        <div class="row" style="margin-top:8px"><select class="input" name="cat" style="width:auto" aria-label="Categoria">${Object.entries(CAT).map(([k, [l]]) => h`<option value="${k}" ${k === "TECNICO" ? "selected" : ""}>${l}</option>`)}</select><span class="grow"></span><button class="btn p">Comentar</button></div></form>` : ""}
      ${v.comments.length === 0 ? empty("msg", "Sem comentários nesta revisão", "") : h`<ul class="list" style="display:flex;flex-direction:column;gap:8px">${v.comments.map((c) => { const i = c.x != null ? ++n : null; return h`<li class="panel pad ${ui.act === c.id ? "act" : ""}" style="border-top:1px solid var(--line);${ui.act === c.id ? "box-shadow:0 0 0 2px color-mix(in oklab,var(--warn) 50%,transparent)" : ""}" data-a="cm" data-v="${c.id}">
          <div class="row xs" style="margin-bottom:4px;gap:6px">${i ? h`<span class="avatar" style="width:20px;height:20px;background:${CAT[c.cat][1]};font-size:11px">${i}</span>` : ""}${badge(CAT[c.cat][0], CAT[c.cat][2])}${c.page ? h`<span class="muted">folha ${c.page}</span>` : ""}<span class="grow"></span><span class="muted">${user(c.author).name} · ${rel(c.at)}</span></div>
          <p class="small" style="margin:0;${c.status !== "ABERTO" ? "color:var(--muted)" : ""}">${c.body}</p>
          ${c.status !== "ABERTO" ? h`<p class="xs" style="margin:6px 0 0;color:var(--ok)">✓ ${c.status === "RESOLVIDO" ? "Resolvido" : "Não aplicável"} por ${user(c.resolvedBy).name}: ${c.resolution}</p>`
            : (canWrite() || u.role === "REVISOR") ? h`<button class="xs" style="background:none;border:0;color:var(--accent);padding:6px 0 0;cursor:pointer" data-a="resolve" data-doc="${d.id}" data-rev="${v.id}" data-id="${c.id}">Registrar tratamento</button>` : ""}
        </li>`; })}</ul>`}`;
  }
  if (ui.tab === "arquivos") return h`
    ${editable ? h`<label class="btn block mb" style="cursor:pointer">${ic("upload")}Anexar arquivos<input type="file" multiple hidden data-upload="${d.id}" data-rev="${v.id}"></label>` : v.status !== "EM_ELABORACAO" ? h`<p class="xs muted row" style="gap:4px">${ic("lock")}Arquivos congelados: a revisão saiu de elaboração (INV-REV-003).</p>` : ""}
    ${v.files.length === 0 ? empty("file", "Sem arquivos", "") : v.files.map((f) => h`<div class="panel pad mb"><div class="row" style="align-items:flex-start">${ic("file")}<div class="grow"><div class="small trunc" style="font-weight:500" title="${f.name}">${f.name}</div>
      <div class="xs muted tnum">${f.role} · ${fmtBytes(f.size)} · ${f.pages} pág.</div><div class="code xxs muted trunc" title="SHA-256 ${f.sha}">sha256 ${f.sha.slice(0, 20)}…</div></div>
      ${f.engine === "texto-nativo" ? badge("Texto nativo", "ok") : badge(`OCR ${f.conf}%`, f.conf >= 80 ? "ok" : "warn")}</div></div>`)}`;
  if (ui.tab === "workflow") {
    const w = v.workflow;
    if (!w) return empty("branch", "Nenhum workflow nesta revisão", editable ? "Use “Enviar para verificação”." : "");
    return h`<div class="row mb"><strong class="small grow">Verificação + aprovação</strong>${badge(w.status.toLowerCase(), w.status === "CONCLUIDO" ? "ok" : w.status === "REPROVADO" ? "bad" : "warn")}</div>
      <ol class="timeline">${w.steps.map((st, i) => h`<li style="--c:${st.status === "APROVADA" ? "var(--ok)" : st.status === "REPROVADA" ? "var(--bad)" : st.status === "PENDENTE" ? "var(--warn)" : "var(--line-strong)"}">
        <div class="small"><strong style="font-weight:600">${st.name}</strong> · ${user(st.assignee).name}</div>
        <div class="xs muted">${st.status === "PENDENTE" ? `Prazo ${fmtDT(st.due)}${new Date(st.due) < new Date() ? " · vencida" : ""}` : st.status === "AGUARDANDO" ? "Aguardando etapa anterior" : `${st.status.toLowerCase()} em ${fmtDT(st.decidedAt)}`}</div>
        ${st.note ? h`<p class="small" style="margin:2px 0 0">“${st.note}”</p>` : ""}
        ${st.status === "PENDENTE" && st.assignee === u.id ? h`<div class="row" style="margin-top:8px"><button class="btn sm danger" data-a="reject" data-doc="${d.id}" data-rev="${v.id}" data-i="${i}">${ic("x")}Reprovar</button><button class="btn sm p" data-a="approve" data-doc="${d.id}" data-rev="${v.id}" data-i="${i}">${ic("check")}Aprovar</button></div>` : ""}
      </li>`)}</ol>
      <p class="xxs muted">O autor da revisão não pode aprová-la (INV-WF-003). Troque de perfil para decidir como revisor ou controle.</p>`;
  }
  if (ui.tab === "texto") {
    const f = v.files[0]; if (!f) return empty("scan", "Texto ainda não extraído", "");
    return h`<div class="xs muted">${f.engine === "texto-nativo" ? "Camada de texto nativa do PDF" : `Tesseract · confiança média ${f.conf}%`}</div><pre class="ocr">${f.text}</pre>`;
  }
  const ev = S.audit.filter((e) => e.id.startsWith(d.code) || e.id === d.code).slice().reverse();
  return ev.length ? h`<ul class="list">${ev.map((e) => h`<li style="padding:8px 0"><div class="small"><strong style="font-weight:600">${e.actor === "sistema" ? "sistema" : user(e.actor).name}</strong> <span class="muted">${e.action.toLowerCase()} ${e.entity}</span></div><div class="xxs muted">${fmtDT(e.at)} · <span class="code" title="${e.hash}">#${e.hash.slice(0, 10)}</span></div></li>`)}</ul>` : empty("hist", "Sem eventos", "");
}

/* ---------- pendências ---------- */
function pgTarefas() {
  const t = myTasks();
  return h`<div class="phead"><div><h1 class="h1">Minhas pendências</h1><p class="small muted" style="margin:2px 0 0">Etapas de workflow com ${me().name}, pela ordem do prazo</p></div></div>
    ${t.length === 0 ? h`<div class="panel">${empty("task", "Nada pendente com você", me().role === "AUTOR" ? "Autores não decidem etapas. Troque para Rui (revisor) ou Carla (controle) para aprovar." : "Quando uma revisão for enviada para você, ela aparece aqui.")}</div>` :
    h`<ul class="list" style="display:flex;flex-direction:column;gap:10px">${t.map(({ d, v, st, i }) => { const late = new Date(st.due) < new Date(); return h`<li class="panel pad" style="${late ? "border-left:4px solid var(--delta)" : ""}">
      <div class="row" style="align-items:flex-start">${delta(v.label)}<div class="grow"><a href="#/doc/${d.id}" class="code xs ink2">${d.code}</a><div style="font-weight:500">${d.title}</div><div class="xs muted">Etapa ${i + 1}: ${st.name}</div></div>${badge(late ? `Vencida ${rel(st.due)}` : `Vence ${rel(st.due)}`, late ? "bad" : "warn")}</div>
      <div class="row" style="margin-top:10px;justify-content:flex-end"><a class="btn sm" href="#/doc/${d.id}" style="margin-right:auto">Abrir e comentar</a><button class="btn sm danger" data-a="reject" data-doc="${d.id}" data-rev="${v.id}" data-i="${i}">${ic("x")}Reprovar</button><button class="btn sm p" data-a="approve" data-doc="${d.id}" data-rev="${v.id}" data-i="${i}">${ic("check")}Aprovar</button></div>
    </li>`; })}</ul>`}`;
}

/* ---------- GRD ---------- */
const GRD_T = { RASCUNHO: "neutral", EMITIDA: "accent", RECEBIDA: "ok", CANCELADA: "neutral" };
function pgGrds() {
  return h`<div class="phead"><div><h1 class="h1">Guias de remessa</h1><p class="small muted" style="margin:2px 0 0">Número sequencial atribuído só na emissão (INV-GRD-001)</p></div>${canControl() ? h`<button class="btn p" data-a="newgrd">${ic("plus")}Nova GRD</button>` : ""}</div>
    ${!canControl() ? h`<p class="small muted mb">GRD é conduzida pelo controle de documentos — troque para Carla para criar e emitir.</p>` : ""}
    <ul class="list panel">${S.grds.map((g) => h`<li><a class="item" href="#/grd/${g.id}">${ic("send")}<span class="grow"><span class="code small">${grdCode(g)}</span><span class="xs muted" style="display:block">${g.recipient} · ${PURPOSE[g.purpose]} · ${g.items.length} item(ns)</span></span><span class="col" style="align-items:flex-end;gap:2px">${badge(g.status.toLowerCase(), GRD_T[g.status])}<span class="xxs muted">${fmtD(g.issuedAt || g.createdAt)}</span></span></a></li>`)}</ul>`;
}
function pgGrd(id) {
  const g = S.grds.find((x) => x.id === id); if (!g) return empty("send", "GRD não encontrada", "");
  const draft = g.status === "RASCUNHO", items = g.items.map((x) => ({ d: findDoc(x.docId), v: findRev(x.revId).v }));
  const cand = draft ? S.docs.flatMap((d) => d.revs.filter((v) => ["APROVADA_INTERNA", "EMITIDA", "APROVADA", "APROVADA_COM_COMENTARIOS"].includes(v.status) && v.current && !g.items.some((x) => x.revId === v.id)).map((v) => ({ d, v }))).sort((a, b) => (a.v.status === "APROVADA_INTERNA" ? -1 : 0) - (b.v.status === "APROVADA_INTERNA" ? -1 : 0)) : [];
  return h`<nav class="xs muted noprint" style="margin-bottom:8px"><a href="#/grd">GRD</a> / ${grdCode(g)}</nav>
    <div class="phead"><div><h1 class="h1 row" style="gap:10px"><span class="code">${grdCode(g)}</span>${badge(g.status.toLowerCase(), GRD_T[g.status])}</h1><p class="small muted" style="margin:2px 0 0">${PROJECT.code} · ${PROJECT.name}</p></div>
      <div class="row wrap noprint">${!draft ? h`<button class="btn" data-a="print">${ic("print")}Imprimir</button>` : ""}${draft && canControl() ? h`<button class="btn danger" data-a="cancelgrd" data-id="${g.id}">Cancelar</button><button class="btn p" data-a="issue" data-id="${g.id}">${ic("send")}Emitir GRD</button>` : ""}</div></div>
    <section class="panel tb mb"><div class="tb-cells" style="grid-template-columns:1fr 1fr">
      <div><div class="k">Destinatário</div><div class="v">${g.recipient}</div></div><div><div class="k">Finalidade</div><div class="v">${g.purpose} · ${PURPOSE[g.purpose]}</div></div>
      <div><div class="k">Emitida</div><div class="v">${fmtDT(g.issuedAt)}${g.issuedBy ? " · " + user(g.issuedBy).name : ""}</div></div><div><div class="k">Recebida</div><div class="v">${fmtDT(g.receivedAt)}${g.receivedBy ? " · " + g.receivedBy : ""}</div></div></div></section>
    ${g.manifest ? h`<p class="xs muted mb">Manifesto SHA-256 <span class="code" style="overflow-wrap:anywhere">${g.manifest}</span> — prova do conteúdo remetido.</p>` : ""}
    <section class="panel mb"><h2 class="h2 pad" style="padding-bottom:0">Itens</h2>
      ${items.length === 0 ? empty("docs", "GRD sem itens", "Inclua abaixo as revisões a remeter.") : h`<ul class="list">${items.map(({ d, v }) => h`<li class="item">${delta(v.label, 24)}<span class="grow"><a href="#/doc/${d.id}" class="code xs ink2">${d.code}</a><span class="trunc small" style="display:block">${d.title}</span></span>${stBadge(v.status)}${draft && canControl() ? h`<button class="btn ghost sm" data-a="rmitem" data-id="${g.id}" data-rev="${v.id}" aria-label="Remover">${ic("trash")}</button>` : ""}</li>`)}</ul>`}
    </section>
    ${draft && canControl() ? h`<section class="panel mb noprint"><div class="row pad" style="padding-bottom:6px"><h2 class="h2 grow" style="margin:0">Revisões disponíveis</h2><button class="btn sm p" data-a="additems" data-id="${g.id}" ${ui.grdSel.length ? "" : "disabled"}>Incluir ${ui.grdSel.length || ""}</button></div>
      ${cand.length === 0 ? h`<p class="small muted pad">Nenhuma revisão aprovada internamente ou emitida disponível.</p>` : h`<ul class="list">${cand.map(({ d, v }) => h`<li><label class="item" style="cursor:pointer"><input type="checkbox" data-a="sel" data-v="${d.id}|${v.id}" ${ui.grdSel.includes(d.id + "|" + v.id) ? "checked" : ""}>${delta(v.label, 24)}<span class="grow"><span class="code xs ink2">${d.code}</span><span class="trunc small" style="display:block">${d.title}</span></span>${stBadge(v.status)}</label></li>`)}</ul>`}
      <p class="xxs muted pad" style="padding-top:0">Dica de teste: inclua uma revisão em elaboração pelo detalhe dela — o banco recusa (INV-GRD-003).</p></section>` : ""}
    ${g.status === "EMITIDA" && canControl() ? h`<form class="panel pad noprint" data-form="receive" data-id="${g.id}"><label class="label" for="rcv">Protocolo de recebimento</label><div class="row"><input id="rcv" class="input" name="who" placeholder="Nome de quem recebeu" required><button class="btn p">Confirmar</button></div></form>` : ""}`;
}

/* ---------- busca ---------- */
function pgBusca() {
  const r = ui.q.trim().length >= 2 ? search(ui.q, ui.mode) : null;
  const groups = r ? [["conteudo", "No conteúdo dos arquivos (OCR)"], ["documentos", "Por código e título"], ["fonetica", "Por som parecido"]].filter(([k]) => r[k].length) : [];
  return h`<div class="phead"><div><h1 class="h1">Busca</h1><p class="small muted" style="margin:2px 0 0">Sem acentos, aproximada e fonética — “aranjo jeral” encontra “arranjo geral”</p></div></div>
    <input class="input mb" type="search" style="min-height:50px;font-size:16px" placeholder="Ex.: válvula de segurança, classe 300, UTE01-ELE" value="${ui.q}" data-in="q" aria-label="Termo de busca" autofocus>
    <div class="chips mb" role="radiogroup">${[["auto", "Tudo"], ["texto", "Conteúdo e código"], ["fonetica", "Fonética"]].map(([k, l]) => h`<button class="chip ${ui.mode === k ? "on" : ""}" data-a="mode" data-v="${k}" role="radio" aria-checked="${ui.mode === k}">${l}</button>`)}</div>
    <div id="results">${!r ? h`<div class="panel">${empty("search", "Digite ao menos duas letras", "Experimente: psv, flange classe 300, caldera, aranjo jeral.")}<div class="chips" style="justify-content:center;padding:0 0 18px">${["psv 1101", "classe 300", "caldera", "aranjo jeral", "curto-circuito"].map((s) => h`<button class="chip" data-a="try" data-v="${s}">${s}</button>`)}</div></div>` :
      groups.length === 0 ? h`<div class="panel">${empty("search", `Nada encontrado para “${ui.q}”`, "Tente a busca fonética ou menos termos.")}</div>` :
      groups.map(([k, l]) => h`<section class="mb"><h2 class="xs muted" style="font-weight:600;margin:0 0 6px">${l} · ${r[k].length}</h2><ul class="list panel">${r[k].map((x) => h`<li><a class="item" href="#/doc/${x.d.id}" style="align-items:flex-start">${delta((x.v || curRev(x.d)).label, 24, x.v && !x.v.current)}<span class="grow"><span class="code xs ink2">${x.d.code}</span><span class="trunc" style="display:block;font-weight:500">${x.d.title}</span>${x.snippet ? h`<span class="small ink2" style="display:block;margin-top:3px">${x.snippet}</span><span class="xxs muted">${x.f.name}</span>` : ""}</span></a></li>`)}</ul></section>`)}</div>`;
}

/* ---------- IA ---------- */
function pgIA() {
  const list = S.sugg.slice().sort((a, b) => (a.status === "PROPOSTA" ? -1 : 1) - (b.status === "PROPOSTA" ? -1 : 1));

/* ---------- upload + pipeline de OCR (simulado, mesmas etapas do worker) ---------- */
function uploadFiles(d, v, files) {
  try { Ops.lockCheck(d); need(v.status === "EM_ELABORACAO", "INV-REV-003", `revisão em ${v.status} tem arquivos congelados`); }
  catch (e) { toast(e.message, "bad", e.code); return; }
  const list = [...files]; if (!list.length) return;
  const steps = ["Enviar e calcular SHA-256", "Normalizar para PDF", "Detectar camada de texto por página", "OCR: inclinação, orientação e contraste", "Gerar PDF/A pesquisável", "Gerar miniatura", "Ler o carimbo"];
  let i = 0, fi = 0;
  sheet("Processando arquivos", h`<p class="small" id="upname" style="margin-top:0"></p><div class="bar mb"><div id="upbar" style="width:0%"></div></div><ul class="steps" id="upsteps">${steps.map((s) => h`<li><span class="st"></span>${s}</li>`)}</ul>`);
  const lis = () => [...document.querySelectorAll("#upsteps li")];
  const tick = async () => {
    const f = list[fi]; $("#upname").textContent = `${fi + 1}/${list.length} · ${f.name}`;
    lis().forEach((li, k) => (li.className = k < i ? "ok" : k === i ? "run" : ""));
    $("#upbar").style.width = `${((fi * steps.length + i) / (list.length * steps.length)) * 100}%`;
    if (i < steps.length) { i++; setTimeout(tick, 260 + Math.random() * 260); return; }
    let text = ocrText(d, v.label);
    if (f.type.startsWith("text/") && f.size < 500000) { try { text = await f.text(); } catch { /* segue com texto sintético */ } }
    const isImg = f.type.startsWith("image/"), native = f.type === "application/pdf" && Math.random() > .4;
    const file = { id: uid(), name: f.name, role: f.type === "application/pdf" || isImg ? "PDF" : "NATIVO", size: f.size || 1024, pages: DRAWING.has(d.type) ? 2 : 3,
      ocr: "CONCLUIDO", engine: native ? "texto-nativo" : "tesseract", conf: native ? null : 74 + Math.floor(Math.random() * 20), text, sha: sha256(f.name + f.size + f.lastModified + uid()) };
    run(() => {
      Ops.addFile(d, v, file);
      if (DRAWING.has(d.type) && !S.sugg.some((s) => s.status === "PROPOSTA" && s.target.docId === d.id && s.kind === "METADADOS_CARIMBO"))
        S.sugg.unshift({ id: uid(), kind: "METADADOS_CARIMBO", target: { type: "doc", docId: d.id }, conf: .72, engine: "carimbo-regex-v1", status: "PROPOSTA", at: nowIso(), payload: { escala: "1:50", folha: "1/2", formato: "A1", arquivo: f.name } });
    });
    fi++; i = 0;
    if (fi < list.length) setTimeout(tick, 200);
    else { closeSheet(); toast(`${list.length} arquivo(s) processado(s)${DRAWING.has(d.type) ? " — a IA leu o carimbo e deixou uma proposta" : ""}`); }
  };
  tick();
}

/* ---------- render ---------- */
function applyTheme() {
  const t = S.theme; if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", dark ? "#0E141A" : "#F3F5F6"));
}
function render() {
  const app = $("#app");
  if (!S.me) { app.innerHTML = login().__raw; return; }
  const [r, id] = route();
  const pages = { painel: pgPainel, docs: pgDocs, doc: () => pgDoc(id), tarefas: pgTarefas, grd: () => (id ? pgGrd(id) : pgGrds()), busca: pgBusca, ia: pgIA, auditoria: pgAuditoria, ajustes: pgAjustes, mais: pgMais };
  const focusSel = document.activeElement?.dataset?.in, caret = document.activeElement?.selectionStart;
  const scroll = window.scrollY;
  app.innerHTML = shell((pages[r] || pgPainel)()).__raw;
  if (focusSel) { const el = document.querySelector(`[data-in="${focusSel}"]`); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch { /* campo sem seleção */ } } }
  window.scrollTo(0, scroll);
}

/* ---------- PWA: manifesto e ícones gerados no próprio arquivo ---------- */
function pngIcon(size, maskable) {
  const svg = LOGO.__raw.replace("<svg", `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"`);
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
      if (maskable) { x.fillStyle = "#14202B"; x.fillRect(0, 0, size, size); const p = size * .12; x.drawImage(img, p, p, size - 2 * p, size - 2 * p); } else x.drawImage(img, 0, 0, size, size);
      res(c.toDataURL("image/png")); };
    img.onerror = () => res(null);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
async function setupPwa() {
  try {
    const [i192, i512, im] = await Promise.all([pngIcon(192), pngIcon(512), pngIcon(512, true)]);
    if (i192) { const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = i192; document.head.appendChild(l); }
    const manifest = { name: "GPlanSiS|DOCS — protótipo", short_name: "GPS DOCS", lang: "pt-BR", display: "standalone", start_url: location.href.split("#")[0], scope: location.href.split("#")[0],
      background_color: "#F3F5F6", theme_color: "#14202B", description: "Gestão de documentos técnicos de engenharia",
      icons: [i192 && { src: i192, sizes: "192x192", type: "image/png" }, i512 && { src: i512, sizes: "512x512", type: "image/png" }, im && { src: im, sizes: "512x512", type: "image/png", purpose: "maskable" }].filter(Boolean) };
    const l = document.createElement("link"); l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch { /* manifesto é melhoria progressiva */ }
}
